name: Build and deploy Jekyll site to Pages

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.decide.outputs.snapshot }}
      skip-reason: ${{ steps.decide.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Anything can affect the built site except these repo-only files.
          predicate-quantifier: some-with-excludes
          filters: |
            site:
              - '**'
              - '!README.md'
              - '!CLAUDE.md'
              - '!.github/**'
              - '!.mergify.yml'
              - '!.vscode/**'
              - '!.gitignore'
              - '!scripts/**'
      # Percy snapshots count against a monthly quota, so skip them when they
      # can't show anything new: no site change, or Mergify merging main into
      # an already-snapshotted PR before queueing it (main's own build still
      # snapshots the merged result).
      - name: Decide whether to take Percy snapshots
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SITE: ${{ steps.filter.outputs.site }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            snapshot=true
          elif [[ "$SITE" != "true" ]]; then
            snapshot=false reason="no site files changed"
          elif [[ "$EVENT" == "pull_request" && "$ACTOR" == "mergify[bot]" ]]; then
            snapshot=false reason="Mergify branch update"
          else
            snapshot=true
          fi
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "skip-reason=${reason:-}" >> "$GITHUB_OUTPUT"

  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Run Jekyll doctor
        run: bundle exec jekyll doctor
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check generated HTML links
        run: bash scripts/run-htmlproofer.sh --disable-external ./_site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  test:
    runs-on: ubuntu-latest
    needs: [build, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: _site/
      - name: Extract site from artifact
        run: tar -xvf _site/artifact.tar --directory=_site/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Percy CLI
        if: needs.changes.outputs.snapshot == 'true'
        run: npm ci --no-audit --no-fund
      - name: Detect system Chrome for Percy
        if: needs.changes.outputs.snapshot == 'true'
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PERCY_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Generate snapshots
        if: needs.changes.outputs.snapshot == 'true'
        timeout-minutes: 15
        run: |
          set -o pipefail
          npx percy snapshot _site/ 2>&1 | tee percy.log
          if grep -q "Build not created" percy.log; then
            echo "Percy reported: Build not created"
            exit 1
          fi
        env:
          PERCY_EXIT_WITH_ZERO_ON_ERROR: false
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      - name: Set snapshot-skipped status
        if: needs.changes.outputs.snapshot != 'true'
        uses: actions/github-script@v9
        env:
          SKIP_REASON: ${{ needs.changes.outputs.skip-reason }}
        with:
          script: |
            const commitSha = context.payload.pull_request?.head?.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: commitSha,
              state: 'success',
              context: 'snapshot-skipped',
              description: `Percy snapshots skipped — ${process.env.SKIP_REASON}`
            });

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
