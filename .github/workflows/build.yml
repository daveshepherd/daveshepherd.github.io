name: Build and deploy Jekyll site to Pages

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            site:
              - '_posts/**'
              - '_layouts/**'
              - '_includes/**'
              - '_sass/**'
              - 'css/**'
              - 'assets/**'
              - '**/*.html'
              - '**/*.md'
              - '_config.yml'
              - 'Gemfile'
              - 'Gemfile.lock'

  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Run Jekyll doctor
        run: bundle exec jekyll doctor
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check generated HTML links
        run: bash scripts/run-htmlproofer.sh --disable-external ./_site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  test:
    runs-on: ubuntu-latest
    needs: [build, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: _site/
      - name: Extract site from artifact
        run: tar -xvf _site/artifact.tar --directory=_site/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "latest"
      - name: Detect system Chrome for Percy
        if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PERCY_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - name: Generate snapshots
        if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: |
          set -o pipefail
          npx --yes @percy/cli snapshot _site/ 2>&1 | tee percy.log
          if grep -q "Build not created" percy.log; then
            echo "Percy reported: Build not created"
            exit 1
          fi
        env:
          PERCY_EXIT_WITH_ZERO_ON_ERROR: false
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      - name: Set snapshot-skipped status
        if: needs.changes.outputs.site != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commitSha = context.payload.pull_request?.head?.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: commitSha,
              state: 'success',
              context: 'snapshot-skipped',
              description: 'Percy snapshots skipped — no site files changed'
            });

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
